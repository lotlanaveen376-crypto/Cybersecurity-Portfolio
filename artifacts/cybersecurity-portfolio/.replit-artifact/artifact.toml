kind = "web"
previewPath = "/"
title = "Cybersecurity Portfolio"
description = "An interactive portfolio for Lotla Naveenkrishnateja, a cybersecurity student seeking a VAPT internship. Showcases hands-on security lab experience, tools, training, education, and a safe simulated Burp Suite Repeater workflow."
version = "1.0.0"
id = "artifacts/cybersecurity-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19869

[services.development]
run = "pnpm --filter @workspace/cybersecurity-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cybersecurity-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/cybersecurity-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19869"
BASE_PATH = "/"
